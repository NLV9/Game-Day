name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android shell
        run: flutter create build_app --org com.example --project-name game_day --platforms android
      - name: Copy app code and patch Android files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
          python3 patch_android.py build_app
      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink --build-number=${{ github.run_number }}
      - name: Sign with the permanent key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cp build_app/build/app/outputs/flutter-apk/app-release.apk gds.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
            $APKSIGNER sign --ks release.jks --ks-key-alias gds --ks-pass env:KS_PASS --key-pass env:KS_PASS gds.apk
            $APKSIGNER verify --print-certs gds.apk
          else
            echo "No signing key found: the APK keeps a temporary key."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: game-day-apk
          path: gds.apk
